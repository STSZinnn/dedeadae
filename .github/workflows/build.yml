
name: Build FrostPVP Reborn

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Build FrostPVP
        shell: bash
        run: |
          set -o pipefail
          gradle clean build --no-daemon --console=plain 2>&1 | tee frost-build.log

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: FrostPVP-build-log
          path: frost-build.log
          if-no-files-found: warn

      - name: Upload plugin JAR
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: FrostPVP-Reborn-v4.3.3
          path: build/libs/*.jar
          if-no-files-found: error
